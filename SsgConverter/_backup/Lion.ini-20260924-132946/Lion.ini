# Lion.ini — AMT177 (FEDERALE) LionDev repository connection
# Location: the Lion directory (E:\Repos\Federale_InternalRelease\Lion\Lion.ini)
# Purpose : points LionDev at the Lion REPOSITORY (metadata) database.
#
# NOTE: the repository DB is SEPARATE from the runtime system DB (FEDERALE_SYSTEM) and from any
#       application DB (e.g. FEDERALE_AFBUS_2200COBOL). Lion.ini holds exactly ONE repository
#       connection — it does not list multiple databases.
# Format confirmed 2026-09-21 against a real working Lion.ini sample (C:\Amt\Working\Lion\Lion.ini
# on a dev PC) and the shipped Default_Lion.ini template.
#
# EXPERIMENT (2026-09-21): FEDERALE_REPOS was created as an EMPTY database (no Lion repository
# schema — Setup.exe/"Sync Repository" was not available from the 177Xfer pull). Testing whether
# LionDev.exe can initialize/create the repository schema itself on first connect. If it errors
# requiring Setup.exe, that confirms Path 1 (LionDev) needs the Setup.exe/Sync-Repository tooling.
#
# DBPSSW becomes encrypted after first successful access — type the real password when LionDev
# prompts for it; do not hand-edit this value.
#
# The block below (before [GENERAL]) mirrors Default_Lion.ini's IIS/backup section. AMT177's
# Control Center is self-hosted on :5100 (not IIS), so CONFIGUREAPPLICATIONSIIS stays False and
# these fields are inert — kept only so LionDev sees the full expected key set.

BACKUPRUNTIME=False
BACKUPDIR=E:\Repos\Federale_InternalRelease\Lion\Backup
SELECTEDAPPLICATIONS=
SELECTEDAPPPOOL=DefaultAppPool
SINGLEAPPPOOL=False
CONFIGUREAPPLICATIONSIIS=False
WEBSITEROOT=Default Web Site
VIRTUALFOLDER=AFBUS2200COBOL
URL=http://localhost/AFBUS2200COBOL
HELPURL=http://help.myasysco.com/AMT%20Helpfiles%20for%20COBOL/default.aspx?target=OS2200

[GENERAL]
DBSSYS=MSSQL
SERVERNAMEREPOSDB=VMFEDPE08
GENERATETHREADS=2
LIONDEVNETSERVICENAME=LionDevNet_Generator
LIONDEVNETSERVERNAME=VMFEDPE08

DBSNAME=FEDERALE_AFBUS_2200COBOL
#DBSNAME=FEDERALE_REPOS

DBUSER=ava
DBPSSW=687087108087
#DBPSSW=385086107086
AMTTEST
